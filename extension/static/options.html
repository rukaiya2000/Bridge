<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bridge options</title>
  <style>
    body { font: 14px system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #1f2933; }
    label { display: block; margin: 10px 0 4px; }
    input[type=text], input[type=password] { width: 100%; padding: 6px; box-sizing: border-box; }
    pre { background: #f5f7fa; padding: 8px; overflow: auto; }
    table { border-collapse: collapse; margin-top: 8px; }
    td, th { border: 1px solid #e4e7eb; padding: 4px 10px; text-align: left; }
    section { margin-bottom: 28px; }
  </style>
</head>
<body>
  <h1>Bridge</h1>
  <section>
    <h2>Settings</h2>
    <label for="provider">Labeling model provider (crisis and abuse rules always run on-device)</label>
    <select id="provider">
      <option value="openai">OpenAI-compatible API (UF Navigator, OpenRouter)</option>
      <option value="gemini">Gemini API</option>
    </select>
    <label for="preset">Endpoint</label>
    <select id="preset"></select>
    <label for="llm-url">Base URL</label>
    <input id="llm-url" type="text" />
    <label for="llm-key">API key (local dev only)</label>
    <input id="llm-key" type="password" autocomplete="off" />
    <label for="llm-model">Model</label>
    <input id="llm-model" type="text" />
    <label for="key">Gemini API key (local dev only)</label>
    <input id="key" type="password" autocomplete="off" />
    <label for="model">Gemini model</label>
    <input id="model" type="text" />
    <label><input id="nudges" type="checkbox" /> Nudges on</label>
    <label><input id="spoken" type="checkbox" /> Speak nudges in voice mode</label>
    <label for="api">Sync API URL</label>
    <input id="api" type="text" />
    <label for="child">Child ID (the dashboard shows "demo")</label>
    <input id="child" type="text" />
    <button id="save">Save</button> <span id="saved"></span>
    <p><button id="sync">Sync now</button> <span id="sync-out"></span></p>
    <p><button id="test">Test labeling</button></p>
    <pre id="test-out"></pre>
  </section>
  <section>
    <h2>Demo replay</h2>
    <select id="arc"></select> <button id="replay">Replay</button>
    <table id="replay-out"></table>
  </section>
  <script src="options.js"></script>
</body>
</html>
