<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Bridge</title>
  <style>
    :root {
      --bg: #ffffff; --text: #1f1f1f; --muted: #6b6f76; --track: #e8eaed; --btn: #f1f3f4; --btn-hover: #e3e5e8;
      --difficult: #d93f5c; --neutral: #c98a00; --positive: #1e8e4e; --life: #7a8494;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #202020; --text: #ececec; --muted: #9a9a9a; --track: #353535; --btn: #2c2c2c; --btn-hover: #383838;
        --difficult: #f28b9d; --neutral: #e8c26a; --positive: #7fd4a0; --life: #aab3c0;
      }
    }
    * { box-sizing: border-box; }
    body { width: 300px; margin: 0; padding: 16px 16px 14px; background: var(--bg); color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    #feelings { display: grid; gap: 14px; max-height: 420px; overflow-y: auto; }
    .row .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .row .n { color: var(--muted); font-variant-numeric: tabular-nums; }
    .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .bar i { height: 6px; border-radius: 3px; background: var(--track); }
    .row.difficult .bar i.on { background: var(--difficult); }
    .row.neutral .bar i.on { background: var(--neutral); }
    .row.positive .bar i.on { background: var(--positive); }
    .row.life .bar i.on { background: var(--life); }
    .empty { color: var(--muted); padding: 4px 0 8px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    button { flex: 1; height: 34px; border: 0; border-radius: 17px; cursor: pointer; font: 500 13px system-ui, -apple-system, sans-serif;
      background: var(--btn); color: var(--text); }
    button:hover { background: var(--btn-hover); }
    button:disabled { opacity: .6; cursor: default; }
  </style>
</head>
<body>
  <h1>Feelings today</h1>
  <div id="feelings"></div>
  <div class="actions">
    <button id="sync-now">Sync now</button>
    <button id="reset" title="Deletes this browser's Bridge data (not the account)">Reset</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
